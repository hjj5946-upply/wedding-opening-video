# main 에 푸시하면 자동으로 빌드해서 GitHub Pages 에 올립니다.
#  주소: https://hjj5946-upply.github.io/wedding-opening-video/
#  ※ GitHub 저장소 → Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 한 번 바꿔야 동작합니다.
#  ※ 음원(public/assets/audio/*.mp3)은 깃에 올리지 않으므로 배포본은 "소리 없이" 재생됩니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 실행

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check # 설정 검사(시간 겹침/규정 초과) — 오류가 있으면 배포 중단
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
